<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Sunflower petals -->
  <g fill="url(#sunGrad)">
    <circle cx="50" cy="20" r="7" opacity="0.9"/>
    <circle cx="70" cy="28" r="7" opacity="0.9"/>
    <circle cx="78" cy="48" r="7" opacity="0.9"/>
    <circle cx="70" cy="68" r="7" opacity="0.9"/>
    <circle cx="50" cy="76" r="7" opacity="0.9"/>
    <circle cx="30" cy="68" r="7" opacity="0.9"/>
    <circle cx="22" cy="48" r="7" opacity="0.9"/>
    <circle cx="30" cy="28" r="7" opacity="0.9"/>
  </g>
  
  <!-- Calendar grid center -->
  <rect x="36" y="36" width="28" height="28" rx="4" fill="white" opacity="0.95"/>
  
  <!-- Calendar grid lines -->
  <line x1="43" y1="36" x2="43" y2="64" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  <line x1="50" y1="36" x2="50" y2="64" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  <line x1="57" y1="36" x2="57" y2="64" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  <line x1="36" y1="43" x2="64" y2="43" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  <line x1="36" y1="50" x2="64" y2="50" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  <line x1="36" y1="57" x2="64" y2="57" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  
  <!-- Calendar dates indicator -->
  <circle cx="40" cy="40" r="2.5" fill="#22c55e"/>
  <circle cx="47" cy="40" r="2.5" fill="#06b6d4"/>
  <circle cx="54" cy="40" r="2.5" fill="#ec4899"/>
  <circle cx="61" cy="40" r="2.5" fill="#f59e0b"/>
</svg>
