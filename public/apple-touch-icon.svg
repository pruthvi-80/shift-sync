<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Sunflower petals -->
  <g fill="url(#sunGrad)">
    <circle cx="90" cy="30" r="13" opacity="0.9"/>
    <circle cx="130" cy="45" r="13" opacity="0.9"/>
    <circle cx="145" cy="90" r="13" opacity="0.9"/>
    <circle cx="130" cy="135" r="13" opacity="0.9"/>
    <circle cx="90" cy="150" r="13" opacity="0.9"/>
    <circle cx="50" cy="135" r="13" opacity="0.9"/>
    <circle cx="35" cy="90" r="13" opacity="0.9"/>
    <circle cx="50" cy="45" r="13" opacity="0.9"/>
  </g>
  
  <!-- Calendar grid center -->
  <rect x="60" y="60" width="60" height="60" rx="8" fill="white" opacity="0.95"/>
  
  <!-- Calendar grid lines -->
  <line x1="80" y1="60" x2="80" y2="120" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="60" x2="100" y2="120" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  
  <line x1="60" y1="80" x2="120" y2="80" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <line x1="60" y1="100" x2="120" y2="100" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  
  <!-- Calendar dates indicator -->
  <circle cx="70" cy="70" r="5" fill="#22c55e" opacity="0.9"/>
  <circle cx="90" cy="70" r="5" fill="#06b6d4" opacity="0.9"/>
  <circle cx="110" cy="70" r="5" fill="#ec4899" opacity="0.9"/>
  
  <circle cx="70" cy="90" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="90" cy="90" r="5" fill="#10b981" opacity="0.9"/>
  <circle cx="110" cy="90" r="5" fill="#8b5cf6" opacity="0.9"/>
</svg>
